# pick_cup configuration. Priority: command-line flag > this file > built-in default.
mode: sim         # sim (MuJoCo only) | dry-run | sdk-sim | real
headless: false   # true: run the simulation / digital twin without the viewer

robot:
  ip: "192.168.1.60"
  calibration: "calibration/xarm6_kinematics.yaml"   # see calibration/README.md

camera:
  handeye: "calibration/eye_in_hand.yaml"           # see calibration/README.md
  serial: ""        # Orbbec serial number; empty: first camera found

task:
  post_verify: true   # after a real run, re-capture the scene and verify the upright cup
  save_vis: "build/pick_cup/real_detection.png"
  save_after_vis: "build/pick_cup/real_after_place.png"
