# screw_nut configuration. Priority: command-line flag > this file > built-in default.
mode: sim         # sim (MuJoCo only) | dry-run | sdk-sim | real
headless: false   # true: run the simulation / digital twin without the viewer

robot:
  ip: "192.168.1.60"
  calibration: "calibration/xarm6_kinematics.yaml"   # see calibration/README.md

camera:
  type: realsense   # realsense: D435/D435i 1280x720@30; orbbec: Gemini 305 1280x800@30
  handeye: null      # null: select by type; explicit path overrides the default
  serial: ""        # SDK serial number; empty: first camera found

task:
  nut_xy: [0.3538, -0.0114]    # initial nut position [x, y] (m), simulation
  nut_yaw_deg: 0.0             # initial nut yaw (deg), simulation
  screw_xy: [0.3560, -0.1028]  # position of the screw glued on the table [x, y] (m), simulation
  thread_turns: 10.0           # clockwise turns after the nut is on the screw tip (7 strokes)
  post_verify: true            # after a real run, re-capture the scene and verify the nut
  save_vis: "build/screw_nut/real_detection.png"
  save_after_vis: "build/screw_nut/real_after_thread.png"
  report: "build/screw_nut/sim_report.json"
